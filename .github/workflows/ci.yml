name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole job takes about 4 minutes; a hung step fails it instead of running on for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        timeout-minutes: 10
        run: .github/scripts/install-ffmpeg.sh
      - run: pip install -e ".[dev,video,heic]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Unit tests
        timeout-minutes: 8
        run: pytest
      - name: Build
        run: pip wheel --no-deps -w dist .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Unit tests with coverage
        run: npm test
      - name: Built files are committed and up to date
        run: |
          git status --porcelain -- ../src/imageskin/static
          test -z "$(git status --porcelain -- ../src/imageskin/static)"
