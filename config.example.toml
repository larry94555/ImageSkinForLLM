# Copy to config.toml and pass with: imageskin --config config.toml serve
host = "127.0.0.1"
port = 8000
log_level = "INFO"

# The LLM the chat talks to: llama-server's OpenAI-compatible API, and its context window in
# tokens (llama-server's --ctx-size). llama-server answers with the model it loaded, whatever
# llm_model says.
llm_url = "http://127.0.0.1:8080/v1"
llm_model = "local"
llm_context_tokens = 4096
