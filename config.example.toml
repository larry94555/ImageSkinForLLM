# Copy to config.toml and pass with: imageskin --config config.toml serve
host = "127.0.0.1"
port = 8000
log_level = "INFO"

# The LLM the chat talks to: llama-server's OpenAI-compatible API. llama-server answers with the
# model it loaded, whatever llm_model says. The context window in tokens is read from llama-server
# (its --ctx-size); llm_context_tokens is used for a server that doesn't report it.
llm_url = "http://127.0.0.1:8080/v1"
llm_model = "local"
llm_context_tokens = 4096

# Whether the chat answers prompts that the PDFs added on Manage Content have nothing on (true),
# or politely declines them (false, the default). Before any PDF is added, every prompt is answered.
# This is only the starting value: once "Answer questions outside the content" is changed on the
# Settings page, the page decides.
general_prompts = false
