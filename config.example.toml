# Copy to config.toml and pass with: imageskin --config config.toml serve
host = "127.0.0.1"
port = 8000
log_level = "INFO"

# The local LLM: llama-server's OpenAI-compatible API. Claude, OpenAI, Grok or OpenRouter is
# picked instead, with your own API key, on the Settings page (roadmap R42). llama-server answers
# with the model it loaded, whatever llm_model says. The context window in tokens is read from
# llama-server (its --ctx-size); llm_context_tokens is used for a server that doesn't report it.
llm_url = "http://127.0.0.1:8080/v1"
llm_model = "local"
llm_context_tokens = 4096

# With a provider picked on the Settings page, raise llm_context_tokens (to 32000, say) to keep
# more of the conversation word for word.

# Whether the chat answers prompts that the PDFs added on Manage Content have nothing on (true),
# or politely declines them (false, the default). Before any PDF is added, every prompt is answered.
# This is only the starting value: once "Answer questions outside the content" is changed on the
# Settings page, the page decides.
general_prompts = false

# The administrator's password file (roadmap R149). Left empty, it is admin.toml in the app's home
# folder (~/.imageskin, or IMAGESKIN_HOME). Copy admin.example.toml there to start.
admin_file = ""

# The laptops allowed to sign in as the administrator (roadmap R163). Left empty, it is
# admin-laptops.toml beside the password file. Copy admin-laptops.example.toml there to start;
# with no file, any laptop can sign in.
admin_laptops_file = ""

# The proxies trusted to name the browser in X-Forwarded-For, such as Caddy in front of the hosted
# site (roadmap R149): addresses or networks separated by commas, or "*" when nothing but a proxy
# can reach the app. Requests from anywhere else count as coming from where they connect from, so
# a visitor can't pretend to be someone else to dodge the wait after wrong admin passwords.
trusted_proxies = "127.0.0.1"

# How many sites keep the person's cloned voice (about 3 GB of memory each) loaded at once
# (roadmap R61d). When another site's is needed, the one used least recently is unloaded, and
# loads again and learns its site's voice and accent, from what was kept, the next time it speaks.
clones_loaded = 2

# The hosted service's domain (roadmap R61). Each site is at name.<main_domain>, as it is at
# name.localhost locally; the domain itself, www and app are the main address's site, and any
# other name gets Site not found, so set it to the domain the app is reached at. Sites are
# added with: imageskin site add name --host their-host@example.com
main_domain = "me0.ai"

# The mail service email is sent through (roadmap R215): a transactional email service's SMTP
# settings. Its password is never kept here: set it in the IMAGESKIN_SMTP_PASSWORD environment
# variable. Port 465 is TLS from the start; any other port must offer STARTTLS. With no
# smtp_host, as on a laptop, each email is written to the outbox folder in the app's home folder
# instead. Check the settings with: imageskin email-test you@example.com
# smtp_host = "smtp.example.com"
# smtp_port = 587
# smtp_user = "apikey"
# mail_from = "me0.ai <noreply@me0.ai>"
