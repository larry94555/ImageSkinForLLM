# The hosted site (roadmap R32): the app, and Caddy in front of it for HTTPS and the password.
# Run from this folder: docker compose up -d --build. See README.md here.
name: imageskin
services:
  app:
    build: ..
    image: imageskin
    restart: unless-stopped
    depends_on:
      - llama
    volumes:
      - imageskin-data:/data
      - ./config.toml:/etc/imageskin/config.toml:ro
    # Not open to the internet: only to Caddy, and to an SSH tunnel through the server's own
    # 127.0.0.1, which Sign in with ChatGPT needs.
    ports:
      - "127.0.0.1:8000:8000"

  # The local LLM, as on the laptop (README, "Chat with the LLM"): llama.cpp's llama-server with
  # Gemma 3 4B, downloaded into its own volume on first start (about 2.5 GB). Half the cores, so
  # the voice and video keep the other half (roadmap R22a). Only the app reaches it.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llama-models:/models
    command: >-
      -hf ggml-org/gemma-3-4b-it-GGUF --no-mmproj --host 0.0.0.0 --port 8080
      --ctx-size 4096 --threads 2

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      LOGIN_NAME: ${LOGIN_NAME:?set LOGIN_NAME in .env}
      LOGIN_PASSWORD_HASH: ${LOGIN_PASSWORD_HASH:?set LOGIN_PASSWORD_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  imageskin-data:
  llama-models:
  caddy-data:
  caddy-config:
