# The hosted site (roadmap R32): the app, and Caddy in front of it for HTTPS and the password.
# Run from this folder: docker compose up -d --build. See README.md here.
name: imageskin
services:
  app:
    build: ..
    image: imageskin
    restart: unless-stopped
    # Caps, so a heavy step slows down or restarts the container instead of freezing the whole
    # machine: Prepare with the LLM running froze a 4-core, 24 GB Oracle machine, which has no
    # swap (Larry's test). The three caps leave about 3 GB and the SSH login to the machine.
    mem_limit: 14g
    cpus: 3
    depends_on:
      - llama
    environment:
      # Start now downloads the default people from Caddy inside Docker (roadmap R32a).
      IMAGESKIN_DEFAULT_PEOPLE_URL: http://caddy:8090
      # A Hugging Face read token, for Pocket TTS's weights that clone a voice (R160, README.md
      # here, step 6e). Without one, the person's own voice is spoken with Chatterbox, slower.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - imageskin-data:/data
      - ./config.toml:/etc/imageskin/config.toml:ro
    # Not published on any port: only Caddy reaches it, with the password. Sign in with ChatGPT is done on the
    # laptop and imported (README.md here, step 8).

  # The local LLM, as on the laptop (README, "Chat with the LLM"): llama.cpp's llama-server with
  # Gemma 3 4B, downloaded into its own volume on first start (about 2.4 GB). It is the Q4_0
  # quantization, which llama.cpp speeds up on ARM: on the hosted machine's Ampere cores it
  # wrote the wiki in a quarter less time than Q4_K_M, the laptop's (R97). It writes on half
  # the cores, so the voice and video keep the other half (roadmap R22a), and reads a prompt on
  # all four, which is over before the voice starts (R97). --swa-full lets it reuse what it has
  # read, such as the replies' warm-up (R97). --cache-ram 1024 caps the prompts it keeps in
  # memory at 1 GB: its default, 8 GB, outgrew the 6 GB cap during a wiki build and the
  # container was killed (Larry's server, 2026-10-24). Only the app reaches it.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    mem_limit: 6g
    cpus: 4
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llama-models:/models
    command: >-
      -hf unsloth/gemma-3-4b-it-GGUF:Q4_0 --no-mmproj --host 0.0.0.0 --port 8080
      --ctx-size 4096 --threads 2 --threads-batch 4 --swa-full --cache-ram 1024

  caddy:
    image: caddy:2
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      LOGIN_NAME: ${LOGIN_NAME:?set LOGIN_NAME in .env}
      LOGIN_PASSWORD_HASH: ${LOGIN_PASSWORD_HASH:?set LOGIN_PASSWORD_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The 60 default people's packs, copied here as tools/default_people/README.md says.
      - ./default-people:/srv/default-people:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  imageskin-data:
  llama-models:
  caddy-data:
  caddy-config:
