# The hosted app's settings (roadmap R32), read when the app starts: run
# `docker compose restart app` after a change. See config.example.toml for every setting.

# Listen on every address inside the container. Only Caddy reaches it, with the password
# (deploy/README.md).
host = "0.0.0.0"
port = 8000
log_level = "INFO"

# The local LLM: llama-server in the llama container (compose.yaml), with Gemma 3 4B. Claude,
# OpenAI, Grok, OpenRouter or a ChatGPT plan can be picked instead on the Settings page; with one
# of those, raise llm_context_tokens (to 32000, say) to keep more of the conversation word for word.
llm_url = "http://llama:8080/v1"

# The administrator's password file (roadmap R149), mounted from deploy/admin/ by compose.yaml.
admin_file = "/etc/imageskin/admin/admin.toml"

# Only Caddy reaches the app (compose.yaml publishes no port for it), so its X-Forwarded-For,
# which it sets afresh for each request, names the browser. The wait after wrong admin passwords
# is then per browser, not shared by everyone behind Caddy.
trusted_proxies = "*"
