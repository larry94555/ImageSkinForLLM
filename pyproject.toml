[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imageskin"
version = "0.1.0"
description = "ImageSkinForLLM: a talking video of a person over an LLM chatbot."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
imageskin = "imageskin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imageskin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=imageskin --cov-report=term-missing"
