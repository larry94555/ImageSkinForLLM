[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imageskin"
version = "0.1.0"
description = "ImageSkinForLLM: a talking video of a person over an LLM chatbot."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Text to speech on the CPU. Kokoro supports Python up to 3.12.
voice = [
    "kokoro>=0.9.4,<0.10",
]
# Video on the CPU. OpenCV 5 no longer bundles the face detector, so stay on 4.x.
video = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8,<5",
]
# Photoreal video on the CPU (LivePortrait, MIT; MediaPipe, Apache 2.0). Python 3.11 or 3.12.
# The models (about 500 MB) are downloaded on first use.
photoreal = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8,<5",
    "torch>=2.4",
    "mediapipe>=0.10.14",
    # Imported by the LivePortrait modules the engine loads.
    "scipy>=1.11",
    "pyyaml>=6",
    "rich>=13",
]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
imageskin = "imageskin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imageskin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["kokoro", "torch", "mediapipe", "mediapipe.*", "src.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=imageskin --cov-report=term-missing"
