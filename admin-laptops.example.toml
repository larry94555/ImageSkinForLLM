# The laptops allowed to sign in as the administrator (roadmap R163). Copy this file to
# admin-laptops.toml beside admin.toml (~/.imageskin on a laptop, deploy/admin/ on the hosted
# machine) and list each laptop. admin-laptops.toml is never committed: .gitignore keeps it out.
#
# Each laptop's ID is on the Settings page, under Administrator, with a button to copy it. Each
# browser on a laptop has its own ID, and clearing the browser's data for the site makes a new
# one, to list again.
#
# With no admin-laptops.toml, any laptop can sign in. Once the file exists, only the laptops
# listed in it can, so a file with none listed lets no laptop sign in. The app reads the file
# again whenever it changes, with no restart; a laptop taken out of it is signed out at once.
#
# [[laptop]]
# name = "Larry's laptop"
# id = "LT-XXXX-XXXX-XXXX-XXXX-XXXX"
